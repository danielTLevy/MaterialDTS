# Model-level defaults
checkpoint: './remote/mattergen/checkpoints/mattergen_base'
model: mattergen
num_inference_steps: 1000
# Conditioning flags for the model
condition_on_density: false
density_condition_value: 15.0
condition_on_dielectric_bandgap: false
condition_on_bulk_modulus: false
eta: 1.0
# Number of atom-count batches the CrystalGenerator draws from
num_batches: 10000
# Classifier-free guidance scale, applied only when a conditioning flag is set
guidance_factor: 2.0
